<!DOCTYPE html>
<html>

<head>
<title>ATPL Excel Converter</title>
</head>

<body>

<h2>ATPL Excel to JSON Converter</h2>

<input type="file" id="file">

<br><br>

<button onclick="convert()">Convert</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script>

function convert(){

let file = document.getElementById("file").files[0];

if(!file){
    alert("Select Excel file first");
    return;
}


let reader = new FileReader();


reader.onload = function(e){

let data = new Uint8Array(e.target.result);

let workbook = XLSX.read(data,{type:"array"});


let sheet = workbook.Sheets[workbook.SheetNames[0]];


let rows = XLSX.utils.sheet_to_json(sheet,{header:1});


let questions = [];


for(let i=4; i<rows.length; i++){

let r = rows[i];


if(!r[0] || !r[1] || !r[5]){
    continue;
}


let correct = String(r[5]).trim().toUpperCase();


let answerIndex;


if(correct=="A"){
answerIndex=0;
}

else if(correct=="B"){
answerIndex=1;
}

else if(correct=="C"){
answerIndex=2;
}

else if(correct=="D"){
answerIndex=3;
}

else{
continue;
}


questions.push({

question:String(r[0]),

options:[
String(r[1]),
String(r[2]),
String(r[3]),
String(r[4])
],

answer:answerIndex

});


}



let json = JSON.stringify(questions,null,2);


let blob = new Blob(
[json],
{type:"application/json"}
);


let link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="questions.json";

link.click();


alert("Conversion completed. Questions: "+questions.length);


};


reader.readAsArrayBuffer(file);


}


</script>


</body>

</html>
